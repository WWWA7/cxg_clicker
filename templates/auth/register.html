{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card themed">
    <div class="auth-hero">
      <img src="/static/img/cxg.png" alt="cxg" class="auth-img">
      <div class="auth-title">创建雌小鬼账户</div>
      <div class="auth-sub">注册后即可保存你的进度</div>
    </div>

    <form method="post">
      {% csrf_token %}
      <input name="username" placeholder="用户名" required />
      <input name="password" type="password" placeholder="密码" required />
      <input name="password_confirm" type="password" placeholder="确认密码" required />
      <button type="submit" class="toggle-btn">注册</button>
    </form>
    <a class="link" href="/login/">已有账号？去登录</a>
  </div>
</div>
{% endblock %}
