{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card themed">
    <div class="auth-hero">
      <img src="/static/img/cxg.png" alt="cxg" class="auth-img">
      <div class="auth-title">雌小鬼点点乐</div>
      <div class="auth-sub">登录开始你的恶作剧计划</div>
    </div>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <input name="username" placeholder="用户名" required />
      <input type="password" name="password" placeholder="密码" required />
      <button type="submit" class="toggle-btn">登录</button>
    </form>
    <a class="link" href="/register/">没有账号？去注册</a>
  </div>
</div>
{% endblock %}
